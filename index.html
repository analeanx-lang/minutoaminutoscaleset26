function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function copiar(bt,txt){
  var fim=function(){var o=bt.textContent;bt.textContent='copiado';bt.classList.add('ok');
    setTimeout(function(){bt.textContent=o;bt.classList.remove('ok');},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(fim,fim);return;}
  var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();
  try{document.execCommand('copy');}catch(e){}document.body.removeChild(a);fim();
}
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function escBr(s){return esc(s).replace(/\n/g,'<br>');}

function parseCSV(t,keep){
  t=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var sep=(t.split('\n')[0].split('\t').length>2)?'\t':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c=='"')q=true;
    else if(c==sep){row.push(cur);cur='';}
    else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;
  }
  row.push(cur);rows.push(row);
  return keep?rows:rows.filter(function(r){return r.join('').trim()!=='';});
}
function col(h,alts){for(var i=0;i<h.length;i++){var n=norm(h[i]);for(var j=0;j<alts.length;j++){if(n===alts[j]||n.indexOf(alts[j])===0)return i;}}return -1;}
function mins(s){s=(s||'').toString().trim();var m=s.match(/(\d{1,2})[:hH.](\d{2})/);if(m)return +m[1]*60 + +m[2];var m2=s.match(/^(\d{1,2})\s*h$/i);return m2?+m2[1]*60:null;}
function hhmm(v){v=((v%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');}
function normURL(u){
  u=(u||'').trim();if(!u)return '';
  if(/output=csv/.test(u))return u;
  var gid=(u.match(/[?&#]gid=(\d+)/)||[])[1];
  var q='pub?output=csv'+(gid?'&gid='+gid:'');
  if(/\/pubhtml/.test(u))return u.replace(/\/pubhtml.*$/,'/'+q);
  if(/\/pub\b/.test(u))return u.replace(/\/pub.*$/,'/'+q);
  if(/\/edit/.test(u))return u.replace(/\/edit.*$/,'/gviz/tq?tqx=out:csv'+(gid?'&gid='+gid:''));
  return u;
}

      continue;
    }
    var ini=mins(c0);
    if(ini===null||!map)continue;
    var ato=(x[map.a]||'').trim();
    if(!ato)continue;
    temDados=true;
    out.push({dia:dia||'Programação',ini:ini,fim:map.f>-1?mins(x[map.f]):null,ato:ato,
      resp:map.r>-1?(x[map.r]||'').trim():'',cont:map.c>-1?(x[map.c]||'').trim():'',
      loc:map.l>-1?(x[map.l]||'').trim():'',st:map.s>-1?(x[map.s]||'').trim():'',
      obs:map.o>-1?(x[map.o]||'').trim():''});
  }
  return out.length?out:null;
}
function aplicarGrade(lista){
  var out=[];lista.forEach(function(a){if(a)out=out.concat(a);});
  if(!out.length)return false;
  for(var k=0;k<out.length;k++){if(out[k].fim===null){var n=out[k+1];out[k].fim=(n&&n.dia===out[k].dia)?n.ini:out[k].ini+30;}}
  GRADE=out;DIAS=[];GRADE.forEach(function(d){if(DIAS.indexOf(d.dia)<0)DIAS.push(d.dia);});
  if(DIAS.indexOf(VIEW)<0&&VIEW!=='p'){var iH=DATAS.indexOf(hoje());VIEW=(iH>-1&&DIAS[iH])?DIAS[iH]:DIAS[0];}
  return true;
}
function lerGrade(txt,diaFixo){return aplicarGrade([parseGrade(txt,diaFixo)]);}

function lerGente(txt){
  if(/google\.visualization/.test(txt))return false;
  var rows=parseCSV(txt,true),hi=-1;
  for(var r=0;r<rows.length&&r<15;r++){
    var linha=rows[r].map(norm);
    var temNome=linha.some(function(c){return c==='palestrante'||c==='nome'||c==='convidado';});
    if(temNome){hi=r;break;}
  }
  if(hi<0)return false;
  var hd=rows[hi];
  var iN=col(hd,['palestrante','nome','convidado']),
      iB=col(hd,['bio','minibio','mini bio','curriculo','sobre','descricao']),
      iT=col(hd,['tema','assunto','titulo']),
      iD=col(hd,['dia']),iH=col(hd,['horario','hora']),
      iO=col(hd,['observ','obs']),iL=-1;
  for(var q=0;q<hd.length;q++){var nq=norm(hd[q]);
    if(q!==iN&&(nq==='palestra'||nq.indexOf('link')===0||nq.indexOf('apresenta')===0||nq.indexOf('slide')===0)){iL=q;break;}}
  var out=[];
  for(var r2=hi+1;r2<rows.length;r2++){
    var x=rows[r2],n=(x[iN]||'').trim();
    var nn=norm(n);
    if(!n||/^coluna\s*\d/i.test(n)||nn==='palestrante'||nn==='nome'||nn==='convidado')continue;
    out.push({nome:n,bio:iB>-1?(x[iB]||'').trim():'',tema:iT>-1?(x[iT]||'').trim():'',
      hora:iH>-1?(x[iH]||'').trim():'',dia:iD>-1?(x[iD]||'').trim():'',
      obs:iO>-1?(x[iO]||'').trim():'',link:iL>-1?(x[iL]||'').trim():''});
  }
  if(!out.length)return false;
  GENTE=out;return true;
}

function acharGente(nome){
  var a=norm(nome);if(!a)return null;
  for(var i=0;i<GENTE.length;i++){var b=norm(GENTE[i].nome);
    if(a===b||a.indexOf(b)>-1||b.indexOf(a)>-1)return GENTE[i];}
  return null;
}
function erro(m){document.getElementById('msg').innerHTML+='<div class="err">'+m+'</div>';}
function titulo(d){
  return (/^(palestra|palestrante)/i.test(d.ato)&&d.resp)?d.resp:d.ato;
}
function agora(){var d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}

function render(){
  var T=DIAS.map(function(d,i){return '<div class="tab'+(d===VIEW?' on':'')+'" onclick="VIEW=\''+d.replace(/'/g,"\\'")+'\';render()">'+esc(d)+(DATAS[i]?' · '+brData(DATAS[i]):'')+'</div>';}).join('');
  if(GENTE.length)T+='<div class="tab'+(VIEW==='p'?' on':'')+'" onclick="VIEW=\'p\';render()">Palestrantes</div>';
  document.getElementById('tabs').innerHTML=T;

  if(VIEW==='p'){
    document.getElementById('body').innerHTML='<div class="cards">'+GENTE.map(function(g){
      var L='';
      if(g.link){L=/^https?:/i.test(g.link)
        ? '<a class="lk" href="'+esc(g.link)+'" target="_blank" rel="noopener">Abrir apresentação</a>'
        : '<span class="na">'+esc(g.link)+'</span>';}
      function fld(rot,txt,html){
        if(!txt)return '';
        return '<div class="fld"><div class="fh"><span>'+rot+'</span>'+
          '<button class="cp" onclick="copiar(this,'+JSON.stringify(txt).replace(/"/g,'&quot;')+')">copiar</button></div>'+
          '<p>'+(html||escBr(txt))+'</p></div>';
      }
      var quando=[g.dia,g.hora].filter(Boolean).join(' · ');
      return '<div class="card"><h3>'+esc(g.nome)+'</h3>'+
        (quando?'<div class="tema">'+esc(quando)+'</div>':'')+
        fld('Bio',g.bio)+fld('Tema da palestra',g.tema)+
        (g.obs?'<div class="fld"><div class="fh"><span>Produção</span></div><p>'+escBr(g.obs)+'</p></div>':'')+
        (g.link?fld('Link da apresentação',g.link,L)
              :'<div class="fld"><div class="fh"><span>Link da apresentação</span></div><p><span class="na">não enviado</span></p></div>')+
        '</div>';}).join('')+'</div>';
    return;
  }

  var iDia=idxDia(VIEW),eHoje=DATAS[iDia]===hoje();
  var t=eHoje?agora():-1,lista=GRADE.filter(function(d){return d.dia===VIEW;}),atual=null,prox=null;
  for(var i=0;i<lista.length;i++){var d=lista[i];
    if(t>=d.ini&&t<d.fim){atual=d;prox=lista[i+1]||null;break;}
    if(t<d.ini){prox=d;break;}}
  var L='';
  if(atual){
    var p=Math.min(100,Math.max(0,(t-atual.ini)/(atual.fim-atual.ini)*100)),g=acharGente(atual.resp);
    L+='<div class="now"><div class="lbl">Acontecendo agora<span class="cd">faltam '+Math.ceil(atual.fim-t)+' min</span></div>'+
      '<div class="desc">'+esc(atual.ato)+'</div>'+
      (atual.resp?'<div class="tit">'+esc(atual.resp)+'</div>':'')+
      (atual.cont?'<div class="cont big">'+esc(atual.cont)+'</div>':'')+
      '<div class="meta">'+hhmm(atual.ini)+'–'+hhmm(atual.fim)+'</div>'+
      (atual.obs?'<div class="at" style="margin-top:8px">⚑ '+esc(atual.obs)+'</div>':'')+
      (g&&g.bio?'<div class="bio">'+escBr(g.bio)+'</div>':'')+
      '<div class="prog"><i style="width:'+p+'%"></i></div></div>';
  } else if(!eHoje){
    L='<div class="next"><div class="lbl">Programação de '+esc(VIEW)+(DATAS[iDia]?' · '+brData(DATAS[iDia]):'')+'</div>'+
      '<div class="tit">'+(DATAS[iDia]>hoje()?'Ainda não aconteceu':'Já aconteceu')+'</div>'+
      '<div class="meta">O acompanhamento ao vivo aparece no dia.</div></div>';
  } else {
    L+='<div class="now"><div class="lbl">Agora</div><div class="tit">'+(lista.length&&t<lista[0].ini?'Ainda não começou':'Fora da grade')+'</div></div>';
  }
  if(prox&&eHoje){
    var g2=acharGente(prox.resp);
    L+='<div class="next"><div class="lbl">A seguir<span class="cd">em '+Math.ceil(prox.ini-t)+' min</span></div>'+
      '<div class="desc">'+esc(prox.ato)+'</div>'+
      (prox.resp?'<div class="tit">'+esc(prox.resp)+'</div>':'')+
      (prox.cont?'<div class="cont big">'+esc(prox.cont)+'</div>':'')+
      (prox.obs?'<div class="at">⚑ '+esc(prox.obs)+'</div>':'')+
      '<div class="meta">'+hhmm(prox.ini)+'</div>'+
      (g2&&g2.bio?'<div class="bio">'+escBr(g2.bio)+'</div>':'')+'</div>';
  }
  var H='<table><tr><th>Horário</th><th>Atividade</th></tr>';
  lista.forEach(function(d){
    var cls=t>=d.fim?'done':(t>=d.ini&&t<d.fim?'live':'');
    H+='<tr class="'+cls+'"><td class="h">'+hhmm(d.ini)+'<small>'+hhmm(d.fim)+'</small></td>'+
      '<td><div class="desc">'+esc(d.ato)+'</div>'+
      (d.resp?'<div class="nom">'+esc(d.resp)+'</div>':'')+
      (d.cont?'<div class="cont">'+esc(d.cont)+'</div>':'')+
      (d.obs?'<div class="at">⚑ '+esc(d.obs)+'</div>':'')+'</td></tr>';
  });
  document.getElementById('body').innerHTML=L+H+'</table>';
}

var SHEET='1UoBNgJpBPbsdIC6odSqkKSFAQp24TSpXNycCHaaj-g8';
function gviz(aba){return 'https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(aba);}
var DIAG=[];
function get(u){
  var alvo=u+(u.indexOf('?')>0?'&':'?')+'t='+Date.now();
  var reg={u:u,st:'?',n:0,ini:''};DIAG.push(reg);
  return fetch(alvo)
    .then(function(r){reg.st=r.status;if(!r.ok)throw 0;return r.text();})
    .then(function(x){
      reg.n=x.length;reg.ini=x.slice(0,50).replace(/\n/g,' ');
      if(/^\s*</.test(x)){reg.st=reg.st+' HTML';throw 1;}
      if(/google\.visualization/.test(x)){reg.st=reg.st+' JSON';throw 1;}
      return x;})
    .catch(function(e){if(reg.st==='?')reg.st='bloqueado';throw e;});
}
function verDiag(){
  var t=DIAG.map(function(d){return d.u+' → '+d.st+' · '+d.n+' car · '+esc(d.ini);}).join('<br>');
  document.getElementById('msg').innerHTML='<div class="hint" style="font-family:ui-monospace,monospace;font-size:10px;line-height:1.7">'+t+'</div>';
}
function tentar(rota,nomes,i){
  i=i||0;
  if(i===0)return get(rota).catch(function(){return tentar(rota,nomes,1);});
  if(i>nomes.length)return Promise.resolve(null);
  return get(gviz(nomes[i-1])).catch(function(){return tentar(rota,nomes,i+1);});
}
function espera(ms){return new Promise(function(r){setTimeout(r,ms);});}

// busca uma aba de cada vez, com uma segunda tentativa se falhar.
// pedir as quatro juntas fazia o Google recusar parte delas.
async function buscarTudo(){
  var alvos=[['/api/sexta',['Sexta','sexta','Dia 1']],
             ['/api/sabado',['Sábado','Sabado','sábado','Dia 2']],
             ['/api/domingo',['Domingo','domingo','Dia 3']],
             ['/api/palestrantes',['Palestrantes','palestrantes','PALESTRANTES','Bio']]];
  var r=[];
  for(var k=0;k<alvos.length;k++){
    var t=await tentar(alvos[k][0],alvos[k][1]);
    if(!t){ await espera(600); t=await tentar(alvos[k][0],alvos[k][1]); }
    r.push(t);
    if(k<alvos.length-1) await espera(300);
  }
  return r;
}

function atualizar(){
  DIAG=[];
  document.getElementById('stt').textContent='Buscando…';
  buscarTudo().then(function(r){
     var g1=r[0]?parseGrade(r[0],'Sexta'):null,
         g2=r[1]?parseGrade(r[1],'Sábado'):null,
         g3=r[2]?parseGrade(r[2],'Domingo'):null;
     var ok=0,txtP=!!r[3],temGrade=!!(g1||g2||g3);
     if(temGrade&&aplicarGrade([g1,g2,g3]))ok++;
     if(r[3]&&lerGente(r[3]))ok++;
     document.getElementById('msg').innerHTML='';
     var faltando=[];
     if(!g1)faltando.push('Sexta');
     if(!g2)faltando.push('Sábado');
     if(!g3)faltando.push('Domingo');
     if(!r[3])faltando.push('Palestrantes');
     var d=new Date(),hora=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
     document.getElementById('stt').textContent=!faltando.length?('Atualizado '+hora)
       :ok===0?'Sem acesso à planilha · usando cópia embutida'
       :('Faltou a aba '+faltando.join(', ')+' — '+hora);
     document.getElementById('stt').style.color=faltando.length?'var(--danger)':'';
     if(faltando.length)verDiag();

     render();
  });
}

// rebusca a planilha sozinho a cada 3 minutos
setInterval(atualizar,180000);

setInterval(function(){
  var d=new Date();
  document.getElementById('clk').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

},1000);
